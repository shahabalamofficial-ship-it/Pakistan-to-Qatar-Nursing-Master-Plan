<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B3D2E">
<meta name="description" content="Pakistan to Qatar Nursing Master Plan — a step-by-step licensing and relocation tracker for nurses moving from Pakistan to Qatar.">
<title>Pakistan → Qatar Nursing Master Plan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@500&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip-link" href="#main" lang="ur" dir="rtl">مرکزی مواد پر جائیں</a>

<header class="boarding-pass" id="top">
  <div class="boarding-pass__main">
    <p class="boarding-pass__eyebrow">BOARDING PASS · NURSING CAREER</p>
    <h1 class="boarding-pass__title">Pakistan <span class="route-arrow" aria-hidden="true">✈</span> Qatar</h1>
    <p class="boarding-pass__subtitle" id="dedication" lang="ur" dir="rtl">لوڈ ہو رہا ہے…</p>
  </div>
  <div class="boarding-pass__stub">
    <div class="stub-row">
      <span class="stub-label">FROM</span>
      <span class="stub-value" id="route-from">PAK</span>
    </div>
    <div class="stub-row">
      <span class="stub-label">TO</span>
      <span class="stub-value" id="route-to">DOH</span>
    </div>
    <div class="stub-row">
      <span class="stub-label">GATE</span>
      <span class="stub-value" id="progress-label">0 / 9</span>
    </div>
    <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>
</header>

<main id="main">
  <p class="disclaimer" id="disclaimer" lang="ur" dir="rtl"></p>

  <ol class="timeline" id="timeline" aria-label="Roadmap stages"></ol>

  <section class="actions" aria-label="Actions">
    <button class="btn btn--ghost" id="btn-export" lang="ur" dir="rtl">JSON کے طور پر محفوظ کریں</button>
    <button class="btn btn--ghost" id="btn-import" lang="ur" dir="rtl">JSON درآمد کریں</button>
    <input type="file" id="file-import" accept="application/json" hidden>
    <button class="btn btn--ghost" id="btn-print" lang="ur" dir="rtl">پرنٹ / PDF ویو</button>
    <button class="btn btn--reset" id="btn-reset" lang="ur" dir="rtl">پیش رفت ری سیٹ کریں</button>
  </section>

  <p class="offline-note" id="offline-note" hidden lang="ur" dir="rtl">📴 آپ آف لائن ہیں — آپ کی پیش رفت اسی ڈیوائس پر محفوظ ہو رہی ہے۔</p>
</main>

<footer class="site-footer">
  <p>Pakistan to Qatar Nursing Master Plan · Built with care · <span id="footer-year"></span></p>
</footer>

<script src="script.js"></script>
</body>
</html>
